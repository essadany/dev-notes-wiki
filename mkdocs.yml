site_name: Dev Notes Wiki
site_description: Base de connaissances technique personnelle — notes de référence sur des concepts maîtrisés, à consulter rapidement en cas de besoin après une longue période sans les utiliser.
site_author: Yassine ES-SADANY
repo_url: https://github.com/essadany/dev-notes-wiki
repo_name: essadany/dev-notes-wiki

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Backend from first principles:
      - 1. Feuille de route pour backend from first principles: backend-from-first-principles/index.md
      - 2. Le chemin d'un vrai ingénieur backend: backend-from-first-principles/02-walk-the-path-of-a-true-backend-engineer.md
      - 3. Qu'est-ce qu'un backend, comment fonctionne-t-il et pourquoi en a-t-on besoin ?: backend-from-first-principles/03-what-is-a-backend.md
      - 4. Les avantages de l'apprentissage de l'ingénierie backend depuis les principes fondamentaux: backend-from-first-principles/04-benefits-of-learning-backend-engineering-from-first-principles.md
      - 5. Comprendre HTTP pour les ingénieurs backend: backend-from-first-principles/05-understanding-http-for-backend-engineers.md
      - 6. Qu'est-ce que le routing dans le backend ?: backend-from-first-principles/06-what-is-routing-in-backend.md
      - 7. La sérialisation et la désérialisation pour les ingénieurs backend: backend-from-first-principles/07-serialization-and-deserialization-for-backend-engineers.md
      - 8. L'authentification et l'autorisation pour les ingénieurs backend: backend-from-first-principles/08-authentication-and-authorization-for-backend-engineers.md
      - 9. Les validations et les transformations pour les ingénieurs backend: backend-from-first-principles/09-validations-and-transformations-for-backend-engineers.md
    
  - Déploiement web:
      - 1. Déploiement d'une app sur EC2 (DNS, ports, reverse proxy): deploiement-web/01-deploiement-ec2-dns-nginx.md